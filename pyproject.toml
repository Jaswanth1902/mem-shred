[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mem-shred"
version = "0.1.0"
description = "Deterministic zero-overhead cryptographic memory zeroization and credential scrubbing."
readme = "README.md"
authors = [{ name = "Jaswanth Reddy", email = "jaswanth1902@users.noreply.github.com" }]
license = "Apache-2.0"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Security :: Cryptography",
    "Topic :: System :: Operating System Kernels",
]
requires-python = ">=3.9"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["memshred*"]
exclude = ["include*", "tests*"]

[project.urls]
Homepage = "https://github.com/Jaswanth1902/mem-shred"
Repository = "https://github.com/Jaswanth1902/mem-shred.git"
Issues = "https://github.com/Jaswanth1902/mem-shred/issues"
